name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: AriaDekami
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%231F6FEB&color_dots=%230d1b3d,%231e3a8a,%232f5fd0,%234b83f0,%237db0ff
            dist/github-contribution-grid-snake.svg?color_snake=%231F6FEB&color_dots=%230d1b3d,%231e3a8a,%232f5fd0,%234b83f0,%237db0ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
